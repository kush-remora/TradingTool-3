<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading TradingTool-3</title>
    <script>
      const siteBasePath = "/TradingTool-3/";
      const appUrl = new URL(siteBasePath, window.location.origin);
      const requestedUrl = `${window.location.pathname}${window.location.search}${window.location.hash}`;

      appUrl.searchParams.set("redirect", requestedUrl);
      window.location.replace(appUrl);
    </script>
  </head>
  <body></body>
</html>
