<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading TradingTool-3</title>
    <script>
      const siteBasePath = "/TradingTool-3/";
      const requestedUrl = `${window.location.pathname}${window.location.search}${window.location.hash}`;

      // GitHub Pages serves this file for SPA deep links. Keep the requested
      // route in session storage, load the app shell, then restore the clean
      // URL before React decides which page to render.
      if (requestedUrl !== siteBasePath) {
        sessionStorage.setItem("tradingtool-github-pages-route", requestedUrl);
        window.location.replace(siteBasePath);
      }
    </script>
  </head>
  <body></body>
</html>
