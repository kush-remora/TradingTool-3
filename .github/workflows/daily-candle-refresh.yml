name: Daily Candle Refresh

on:
  schedule:
    - cron: '0 4 * * 1-5' # 09:30 IST
    - cron: '30 11 * * 1-5' # 17:00 IST
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Refresh daily candles
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
        run: |
          mvn -pl cron-job -am install -DskipTests --no-transfer-progress
          mvn -pl cron-job exec:java -Dexec.mainClass=com.tradingtool.cron.DailyCandleRefreshJobKt --no-transfer-progress
